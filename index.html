<!DOCTYPE html>
<html lang="zh-CN" data-app-shell="singlefile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小日常 PWA - 精美打卡应用</title>
  
  <!-- PWA 支持与 SEO 元标记 -->
  <meta name="description" content="一个设计精致、拥有流畅毛玻璃质感与微交互的习惯打卡应用，支持离线运行。">
  <meta name="theme-color" content="#08090d">
  
  <!-- PWA 主屏幕 / 独立窗口 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小日常">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">
  
  <!-- Manifest 引入 -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./assets/icons/icon-192x192.png">
  <script>
    (function () {
      var DEV_PORTS = { '5173': 1, '5174': 1 };
      try {
        var port = location.port;
        var saved = localStorage.getItem('ht-launch-origin');
        if (DEV_PORTS[port] && saved && saved !== location.origin && !DEV_PORTS[new URL(saved).port]) {
          location.replace(saved + location.pathname + location.search + location.hash);
          return;
        }
        if (!DEV_PORTS[port]) {
          localStorage.setItem('ht-launch-origin', location.origin);
        }
      } catch (e) {}
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(new URL('sw.js', document.baseURI).href, { updateViaCache: 'none' }).catch(function () {});
      }
      window.addEventListener('load', function () {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(function () {});
        }
      }, { once: true });
    })();
  </script>
  <style>
    /* 防止 FOUC：仅隐藏非激活视图，不改动布局尺寸 */
    .view:not(.active) {
      opacity: 0;
      pointer-events: none;
    }
    .loader-container {
      position: absolute;
      inset: 0;
      background: #08090d;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #boot-error {
      flex-direction: column;
      padding: 28px 24px;
      text-align: center;
      gap: 10px;
    }
    #boot-error p { margin: 0; color: #e8e8ed; font-size: 0.95rem; line-height: 1.5; }
    #boot-error [data-boot-msg] { color: #9898a0; font-size: 0.8rem; }
    #boot-error button {
      margin-top: 8px;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>

<body>

  <div id="app">
    
    <!-- 极速启动屏加载圈 -->
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
    </div>

    <div id="boot-error" class="loader-container" style="display: none;" role="alert">
      <p>无法从本地缓存启动</p>
      <p data-boot-msg>请联网打开一次，待加载完成后再断网使用。</p>
      <button type="button" onclick="location.reload()">重试</button>
    </div>

    <!-- 核心视图页面集合 -->
    <div class="views-container">
      
      <!-- 1. 打卡列表主视图 -->
      <div id="view-dashboard" class="view active">
        <!-- 由 ui.js 动态渲染 -->
      </div>

      <!-- 2. 数据分析与统计视图 -->
      <div id="view-stats" class="view">
        <div class="header-bar">
          <div>
            <h1>统计中心</h1>
            <div class="subtitle">记录你的坚持与成长</div>
          </div>
        </div>
        <!-- 大部分统计内容由 ui.js 动态渲染 -->
      </div>

      <!-- 3. 系统配置与关于视图 -->
      <div id="view-settings" class="view">
        <div class="header-bar">
          <div>
            <h1>偏好设置</h1>
            <div class="subtitle">让打卡更符合你的习惯</div>
          </div>
        </div>

        <div class="settings-list">
          
          <!-- 主题切换 -->
          <div class="glass-card">
            <div class="form-group" style="margin-bottom: 0;">
              <span class="form-label" style="margin-bottom: 10px;">界面外观</span>
              <div class="segment-control" id="theme-segment">
                <div class="segment-item" data-theme="dark">深色太空</div>
                <div class="segment-item" data-theme="light">浅净明亮</div>
                <div class="segment-item" data-theme="auto">跟随系统</div>
              </div>
            </div>
          </div>

          <!-- 通知授权 (PWA 特有) -->
          <div class="glass-card" id="notify-row">
            <div class="settings-item">
              <div class="settings-item-info">
                <span class="settings-item-title">每日打卡提醒</span>
                <span class="settings-item-desc">开启后将按时发送通知提醒您打卡</span>
              </div>
              <div class="switch-btn" id="switch-notifications"></div>
            </div>
          </div>

          <!-- 安装 PWA -->
          <div class="glass-card" id="install-row" style="display: none;">
            <div class="settings-item">
              <div class="settings-item-info">
                <span class="settings-item-title">安装到桌面</span>
                <span class="settings-item-desc">支持离线运行。若浏览器无安装提示，请在菜单中选择「添加到主屏幕」</span>
              </div>
              <button class="btn-secondary" id="btn-install">添加</button>
            </div>
          </div>

          <!-- 数据管理 -->
          <div class="glass-card">
            <span class="form-label" style="margin-bottom: 6px;">数据备份与恢复</span>
            <p class="settings-item-desc" style="margin-bottom: 12px; display: block;">
              可选密码保护：导出与导入的加解密均在浏览器本地完成，数据不会上传至任何服务器。
            </p>
            <div style="display: flex; gap: 12px;">
              <button class="btn-secondary" id="btn-export" style="flex: 1; padding: 12px 0;">导出本地备份</button>
              <button class="btn-secondary" id="btn-import" style="flex: 1; padding: 12px 0;">导入本地备份</button>
            </div>
            <input type="file" id="file-import" accept=".json" style="display: none;">
          </div>

          <!-- 关于应用 -->
          <div class="glass-card" style="text-align: center; padding: var(--spacing-lg) var(--spacing-md); color: var(--text-muted);">
            <img class="app-logo-preview" src="./assets/icons/icon-192x192.png" alt="小日常" width="72" height="72" />
            <div style="font-weight: 700; color: var(--text-secondary); font-size: 0.95rem;">小日常打卡 v1.0.0</div>
            <div style="font-size: 0.75rem; margin-top: 6px;">纯本地运行 • 无服务器 • 加载一次后断网可用</div>
          </div>

        </div>
      </div>

    </div>

    <!-- 底部 Tab 导航栏 -->
    <nav class="tab-bar">
      <div class="tab-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 11 3 3L22 4"></path>
          <rect x="3" y="5" width="6" height="6" rx="1"></rect>
          <path d="M3 17a2 2 0 0 0 2 2h6"></path>
          <path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V11"></path>
        </svg>
        <span>日常</span>
      </div>
      <div class="tab-item" data-view="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>统计</span>
      </div>
      <div class="tab-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>偏好</span>
      </div>
    </nav>

    <!-- 悬浮创建习惯按钮 (FAB) -->
    <div id="fab-add" class="fab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>

    <!-- 习惯创建与修改模态框 Overlay -->
    <div id="modal-overlay" class="modal-overlay">
      <div id="modal-container" class="modal-container">
        
        <div class="modal-header">
          <h2 id="modal-title">新建习惯</h2>
          <div id="modal-close" class="modal-close-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
        </div>

        <form id="habit-form">
          
          <!-- 习惯名称 -->
          <div class="form-group">
            <label class="form-label" for="habit-name">名称</label>
            <input type="text" id="habit-name" class="glass-input" placeholder="输入习惯，例如：坚持跑步 3 公里" maxlength="20" required autocomplete="off">
          </div>

          <!-- 习惯寄语 -->
          <div class="form-group">
            <label class="form-label" for="habit-quote">励志寄语 (选填)</label>
            <input type="text" id="habit-quote" class="glass-input" placeholder="例如：自律即自由" maxlength="30" autocomplete="off">
          </div>

          <!-- 配色主题选择 -->
          <div class="form-group">
            <label class="form-label">主题色彩</label>
            <div class="color-grid">
              <!-- 由 ui.js 动态渲染 -->
            </div>
          </div>

          <!-- 图标选择 -->
          <div class="form-group">
            <label class="form-label">习惯图标</label>
            <div class="icon-grid">
              <!-- 由 ui.js 动态渲染 -->
            </div>
          </div>

          <!-- 时间段归类 -->
          <div class="form-group">
            <label class="form-label">打卡时段</label>
            <div class="segment-control">
              <div class="segment-item active" data-segment="morning">晨间</div>
              <div class="segment-item" data-segment="afternoon">午后</div>
              <div class="segment-item" data-segment="evening">晚间</div>
              <div class="segment-item" data-segment="all">全天</div>
            </div>
          </div>

          <!-- 周期选择 -->
          <div class="form-group">
            <label class="form-label">频率设定</label>
            <div class="day-selector">
              <div class="day-select-btn active" data-day="1">一</div>
              <div class="day-select-btn active" data-day="2">二</div>
              <div class="day-select-btn active" data-day="3">三</div>
              <div class="day-select-btn active" data-day="4">四</div>
              <div class="day-select-btn active" data-day="5">五</div>
              <div class="day-select-btn active" data-day="6">六</div>
              <div class="day-select-btn active" data-day="0">日</div>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="form-group" style="margin-top: var(--spacing-xl); margin-bottom: 0;">
            <button type="submit" class="btn-primary">保存习惯</button>
            <button type="button" id="btn-delete-habit" class="btn-danger-outline" style="display: none;">删除习惯</button>
          </div>

        </form>

      </div>
    </div>

  </div>

</body>
</html>
